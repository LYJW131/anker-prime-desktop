name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Contract is up to date
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q cryptography
          "$RUNNER_TEMP/venv/bin/python" tools/contract.py verify
      - name: Catalogs are generated
        run: |
          go tool mygo generate
          git diff --exit-code locales/catalog_gen.go
      - name: Build the app
        run: go tool mygo build -platform darwin/arm64 -skip-dmg

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet for Windows and Linux
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=linux GOARCH=amd64 go vet ./...
      - name: Build for Windows and Linux
        run: go tool mygo build -platform "windows/amd64,linux/amd64"
