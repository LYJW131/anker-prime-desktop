name: Release

# Push a tag v<version> matching mygo.json's version: every platform builds
# at once into a draft release, which is published once all have uploaded.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches mygo.json
        run: |
          want="v$(jq -r .version mygo.json)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but mygo.json says $want" >&2
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Anker Prime Desktop $GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version mygo.json)"
          # The packages carry the version in their names; the bare
          # executables and install scripts would collide across targets.
          files=$(find build -maxdepth 2 -type f \( -name "anker-prime-desktop-${version}*" -o -name "anker-prime-desktop_${version}*" \))
          if [ -z "$files" ]; then
            echo "no packages under build/" >&2
            find build -maxdepth 2 -type f >&2
            exit 1
          fi
          echo "$files"
          echo "$files" | tr '\n' '\0' | xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
