name: Release

# Push a tag v<version> matching mygo.json's version: the platforms build
# one after another into a draft release, with the signed update manifests
# installed apps read, and the release is published once all have uploaded.
# The notes of the update window come from CHANGELOG.md. The macOS app is
# signed with the self-signed certificate in MACOS_SIGNING_IDENTITY (key and
# certificate, PEM): one identity across versions keeps the Keychain and
# Bluetooth grants of installed apps.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches mygo.json
        run: |
          want="v$(jq -r .version mygo.json)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but mygo.json says $want" >&2
            exit 1
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME%%+*}" in *-*) flags=(--prerelease) ;; esac
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Anker Prime Desktop $GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          fi

  build:
    needs: draft
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64", sign: "Anker Prime Desktop" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Import the code signing identity
        if: matrix.sign
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 16)
          security create-keychain -p "$pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pass" "$kc"
          printf '%s\n' "$MACOS_SIGNING_IDENTITY" > "$RUNNER_TEMP/identity.pem"
          security import "$RUNNER_TEMP/identity.pem" -k "$kc" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/identity.pem"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$kc" | grep -q "\"${{ matrix.sign }}\""
      - name: Build, sign the updates and upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -sign "${{ matrix.sign || '-' }}" -upload

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Every asset has a line in SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$dir"
          listed="$(sed -E 's/^[0-9a-f]{64} [ *]//; s/ /./g' "$dir/SHA256SUMS")"
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          [ -n "$assets" ] || { echo "the release has no assets" >&2; exit 1; }
          missing=0
          while IFS= read -r name; do
            case "$name" in SHA256SUMS | update-*.json) continue ;; esac
            if ! printf '%s\n' "$listed" | grep -Fxq -- "$name"; then
              echo "SHA256SUMS lacks $name" >&2
              missing=1
            fi
          done <<< "$assets"
          exit "$missing"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--latest)
          case "${GITHUB_REF_NAME%%+*}" in *-*) flags=(--prerelease --latest=false) ;; esac
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
